
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <title>Sprint History | Stories</title>
</head>

<body>
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>

  <header class="header">
    <a href="/" class="logo">Stories</a>

    <div class="nav-right">
      <div id="inboxIcon" class="inbox-icon">
        🔔
        <span id="inboxBadge" class="inbox-badge hidden"></span>
      </div>

      <div id="authArea"></div>
    </div>
  </header>

  <div id="inboxPanel" class="inbox-panel hidden">
    <h3>Share Requests</h3>
    <div id="inboxList" class="inbox-list"></div>
  </div>

  <main class="container" style="margin-top: 60px;">

    <h2 class="title">Sprint History</h2>

    <p id="projectName" class="project-subtitle">
      Loading project...
    </p>

    <div style="
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    ">
      <a id="backToSprintBtn" class="btn">
        Back to Sprint Backlog
      </a>

      <a id="switchProductBtn" class="btn">
        Product Backlog
      </a>
    </div>

    <div style="margin-top: 45px;">
      <h3>Completed Sprints</h3>

      <p style="color: var(--purple-light); margin-top: 10px;">
        Review completed user stories from previous sprints.
      </p>

      <div
        id="sprintHistoryList"
        style="margin-top: 25px;"
      >
        Loading sprint history...
      </div>
    </div>

  </main>

  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/auth-state.js"></script>
  <script type="module" src="/js/loading.js"></script>
  <script type="module" src="/js/inbox.js"></script>
  <script type="module" src="/js/sharing.js"></script>
  <script type="module" src="/js/sprint-history.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("project");

    document.getElementById("backToSprintBtn").href =
      `/sprint-backlog?project=${encodeURIComponent(projectId || "")}`;

    document.getElementById("switchProductBtn").href =
      `/product-backlog?project=${encodeURIComponent(projectId || "")}`;
  </script>
</body>
</html>
