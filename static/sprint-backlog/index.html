<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Sprint Backlog</title>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
  </div>

  <header class="header">
    <a href="/" class="logo">Stories</a>
    <div class="nav-right">
      <div id="inboxIcon" class="inbox-icon">
        🔔
        <span id="inboxBadge" class="inbox-badge hidden"></span>
      </div>
      <div id="authArea"></div>
    </div>
  </header>

  <div id="inboxPanel" class="inbox-panel hidden">
    <h3>Share Requests</h3>
    <div id="inboxList" class="inbox-list"></div>
  </div>

  <div class="container" style="margin-top: 60px;">
    <h2 class="title">Sprint Backlog</h2>

    <div style="display:flex; justify-content:center; gap:20px; margin-top:25px;">
      <a id="switchProductBtn" class="btn">Switch to Product Backlog</a>

      <div class="sort-container">
        <button id="sortBtn" class="btn">Sort By</button>
        <div id="sortMenu" class="sort-menu hidden">
          <div data-sort="id">ID</div>
          <div data-sort="priority">Priority</div>
          <div data-sort="estimate">Estimate</div>
          <div data-sort="spike">Spike</div>
          <div data-sort="status">Status</div>
          <div data-sort="assigned">Assigned Developer</div>
        </div>
      </div>

      <button id="completeSprintBtn" class="btn">Complete Sprint</button>
    </div>
  </div>

  <table id="storyTable" class="story-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>User Story / Task</th>
        <th>Priority</th>
        <th>Estimate</th>
        <th>Spike</th>
        <th>Status</th>
        <th>Assigned</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="storyList"></tbody>
  </table>

  <div id="deleteModal" class="modal hidden">
    <div class="modal-content delete-modal">
      <h3>Delete User Story</h3>
      <p>Are you sure you want to delete this story? This action cannot be undone.</p>
      <div class="modal-buttons">
        <button id="confirmDeleteBtn" class="btn" style="background:#d9534f;">Delete</button>
        <button id="cancelDeleteBtn" class="btn cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/auth-state.js"></script>
  <script type="module" src="/js/loading.js"></script>
  <script type="module" src="/js/inbox.js"></script>
  <script type="module" src="/js/sharing.js"></script>
  <script type="module" src="/js/sprint-backlog.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("project");
    document.getElementById("switchProductBtn").href =
      `/product-backlog?project=${projectId}`;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
