<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Login | Stories</title>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">Stories</a>
  </header>

  <div class="auth-page-container">
    <h2 class="auth-page-title">Login</h2>

    <form>
      <input id="loginEmail" type="email" class="auth-input" placeholder="Email" required />
      <input id="loginPassword" type="password" class="auth-input" placeholder="Password" required />
      <button type="submit" class="auth-submit">Login</button>
    </form>

    <div class="auth-divider">or</div>

    <button id="googleLoginBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Continue with Google
    </button>

    <a href="/logins/signup.html" class="auth-switch">Don't have an account? Sign Up</a>
    <a href="/logins/forgot-password.html" class="auth-switch" style="margin-top: 8px;">Forgot your password?</a>
    <a href="/" class="auth-switch">Back to Home</a>
  </div>

  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/auth-state.js"></script>
  <script type="module" src="/js/auth-login.js"></script>
</body>
</html>
