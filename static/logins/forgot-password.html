<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Forgot Password | Stories</title>
</head>

<body>
    <header class="header">
        <a href="/" class="logo">Stories</a>
    </header>

    <div class="auth-page-container">
        <h2 class="auth-page-title">Reset Password</h2>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 16px;">
            Enter your email and we'll send you a reset link.
        </p>

        <form>
            <input id="resetEmail" type="email" class="auth-input" placeholder="Email" required />
            <button type="submit" class="auth-submit">Send Reset Link</button>
        </form>

        <a href="/logins/login.html" class="auth-switch">Back to Login</a>
    </div>

    <div id="customPopup" class="popup-overlay hidden">
        <div class="popup-box">
            <h3 id="popupTitle">Notice</h3>
            <p id="popupMessage"></p>
            <button id="popupCloseBtn">OK</button>
        </div>
    </div>

    <script type="module" src="/js/firebase.js"></script>
    <script type="module" src="/js/popup.js"></script>
    <script type="module" src="/js/auth-forgot-password.js"></script>
</body>

</html>
